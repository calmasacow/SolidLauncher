[package]
name = "solid-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Install, update and open SolidCraft"
publish = false

[[bin]]
name = "solid-launcher"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Notifications: D-Bus on Linux and the BSDs, the notification centre on macOS, toasts
# on Windows. One call instead of shelling out to notify-send, which only Linux has.
notify-rust = { version = "4", default-features = false, features = ["z"] }
serde_json.workspace = true
solid-launcher-native.workspace = true

# Linux, the BSDs and macOS keep the OpenGL renderer, which is what they have been
# tested on.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# Windows gets wgpu instead, so the window is drawn through DirectX 12. A machine with no
# graphics driver falls back to Microsoft's Basic Display Adapter, whose OpenGL is 1.1 —
# too old for glow, while DX12 still works there through WARP.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
# eframe's own wgpu dependency asks for the `metal` and `webgpu` backends and nothing
# else, so on Windows wgpu is built with no backend at all: it finds no adapter, eframe
# cannot make a surface, and the launcher exits before it draws anything. Naming wgpu
# here with `dx12` puts that backend back in through feature unification. That is the
# only Windows backend wgpu 24 offers as a feature of its own, and it is the one wanted:
# a machine with no graphics driver still reaches it through WARP.
wgpu = { version = "24", default-features = false, features = ["dx12"] }
# The single-instance handoff listens on loopback, so its secret comes from the system.
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.25"

# Linux and the BSDs: StatusNotifierItem over D-Bus, so the bar icon needs no GTK.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

# Not under `cfg(windows)`: build dependencies are resolved for the machine doing the
# building, so gating on that would leave out the one case that needs it most — building a
# Windows executable from somewhere else. build.rs checks the target instead.
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
