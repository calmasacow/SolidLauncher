[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
solid-launcher-core = { path = "crates/core" }
solid-launcher-native = { path = "crates/native" }
semver = "1"
serde_json = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# Windows ships a portable .zip where the other platforms ship a .tar.gz.
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
dirs = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
