name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the version
        id: ver
        run: |
          cargo_ver=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$cargo_ver" ]; then
              echo "tag v$tag does not match Cargo.toml version $cargo_ver" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            librsvg2-bin \
            binutils
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Build
        run: cargo build --release --locked -p solid-launcher --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/solid-launcher --help
      - name: Package
        run: |
          packaging/unix/package.sh \
            "${{ needs.version.outputs.version }}" linux "${{ matrix.arch }}" \
            "target/${{ matrix.target }}/release/solid-launcher"
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/solid-launcher-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --workspace --locked --all-targets
      - name: Build
        run: cargo build --release --locked -p solid-launcher --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.arch == 'x64'
        run: ./target/${{ matrix.target }}/release/solid-launcher.exe --help
      - name: Package
        run: |
          packaging/windows/package.ps1 `
            -Version "${{ needs.version.outputs.version }}" `
            -Arch "${{ matrix.arch }}" `
            -Binary "target/${{ matrix.target }}/release/solid-launcher.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
          path: dist/solid-launcher-*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          # One file per platform; a missing one means a build job silently produced nothing.
          test "$(ls -1 solid-launcher-*.tar.gz | wc -l)" -eq 2
          test "$(ls -1 solid-launcher-*.zip | wc -l)" -eq 2
          sha256sum solid-launcher-*.tar.gz solid-launcher-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes=$(mktemp)
          sed "s/@VERSION@/${VERSION}/g" "$GITHUB_WORKSPACE/packaging/unix/install.md" > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SolidLauncher ${VERSION}" \
            --generate-notes \
            --notes "$(cat "$notes")" \
            solid-launcher-*.tar.gz \
            solid-launcher-*.zip \
            SHA256SUMS.txt
