name: Release

on:
  push:
    tags: ["v*"]
  # Publishing a release from github.com creates the tag there rather than by a push, so
  # that path needs its own trigger. Both end up in the same `publish` job below.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the version
        id: ver
        run: |
          cargo_ver=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$cargo_ver" ]; then
              echo "tag v$tag does not match Cargo.toml version $cargo_ver" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      NFPM_VERSION: "2.43.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            binutils
      - name: Packaging tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin desktop-file-utils
          case "${{ matrix.arch }}" in
            x86_64) nfpm_arch=x86_64; appimage_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; appimage_arch=aarch64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          sudo install -m 755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          nfpm --version
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
          # The runners have no FUSE, so the tool unpacks itself instead of mounting.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Build
        run: cargo build --release --locked -p solid-launcher --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/solid-launcher --help
      - name: Package
        run: |
          packaging/unix/package.sh \
            "${{ needs.version.outputs.version }}" linux "${{ matrix.arch }}" \
            "target/${{ matrix.target }}/release/solid-launcher"
      - name: Check the packages
        run: |
          set -eu
          v="${{ needs.version.outputs.version }}"
          a="${{ matrix.arch }}"
          dpkg-deb --info "dist/solid-launcher-$v-linux-$a.deb"
          dpkg-deb --contents "dist/solid-launcher-$v-linux-$a.deb" | grep -F usr/bin/solid-launcher
          # An AppImage that is not executable is a file nobody can run.
          test -x "dist/solid-launcher-$v-linux-$a.AppImage"
          desktop-file-validate packaging/unix/solid-launcher.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            dist/solid-launcher-*.tar.gz
            dist/solid-launcher-*.AppImage
            dist/solid-launcher-*.deb
            dist/solid-launcher-*.rpm
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --workspace --locked --all-targets
      - name: Build
        run: cargo build --release --locked -p solid-launcher --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.arch == 'x64'
        run: ./target/${{ matrix.target }}/release/solid-launcher.exe --help
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package
        run: |
          packaging/windows/package.ps1 `
            -Version "${{ needs.version.outputs.version }}" `
            -Arch "${{ matrix.arch }}" `
            -Binary "target/${{ matrix.target }}/release/solid-launcher.exe"
        shell: pwsh
      - name: Check the installer
        shell: pwsh
        run: |
          $msi = Get-Item dist/solid-launcher-*.msi
          if ($msi.Length -lt 1MB) { throw "$($msi.Name) is suspiciously small" }
          # The MSI must carry the program, or it installs nothing.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null,
                  $installer, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db,
                  @("SELECT FileName FROM File"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $names = @()
          while ($true) {
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) { break }
            $names += $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
          }
          Write-Host "files in the MSI: $($names -join ', ')"
          if (-not ($names -match 'solid-launcher.exe')) { throw "the MSI has no solid-launcher.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            dist/solid-launcher-*.zip
            dist/solid-launcher-*.msi
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Import the signing certificate
        # Skipped when the secrets are not set: the build is then ad-hoc signed, and the
        # first start needs right-click then Open. See docs/signing.md.
        if: env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo -n "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
      - name: Store the notarization credentials
        if: env.NOTARY_KEY != ''
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          echo -n "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials solidlauncher \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' && 'solidlauncher' || '' }}
        run: packaging/macos/package.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: solid-launcher-${{ needs.version.outputs.version }}-macos-universal
          path: dist/solid-launcher-*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          # Every file the release is expected to carry, by name. A count would pass while
          # one platform was missing and another had built twice.
          expected="
            solid-launcher-$VERSION-linux-x86_64.tar.gz
            solid-launcher-$VERSION-linux-x86_64.AppImage
            solid-launcher-$VERSION-linux-x86_64.deb
            solid-launcher-$VERSION-linux-x86_64.rpm
            solid-launcher-$VERSION-linux-aarch64.tar.gz
            solid-launcher-$VERSION-linux-aarch64.AppImage
            solid-launcher-$VERSION-linux-aarch64.deb
            solid-launcher-$VERSION-linux-aarch64.rpm
            solid-launcher-$VERSION-windows-x64.msi
            solid-launcher-$VERSION-windows-x64.zip
            solid-launcher-$VERSION-windows-arm64.msi
            solid-launcher-$VERSION-windows-arm64.zip
            solid-launcher-$VERSION-macos-universal.zip
          "
          missing=0
          for f in $expected; do
            if [ ! -s "$f" ]; then echo "missing or empty: $f" >&2; missing=1; fi
          done
          test "$missing" -eq 0
          # shellcheck disable=SC2086
          sha256sum $expected > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes=$(mktemp)
          sed "s/@VERSION@/${VERSION}/g" "$GITHUB_WORKSPACE/packaging/unix/install.md" > "$notes"
          # shellcheck disable=SC2086
          files=($expected SHA256SUMS.txt)
          # A release made from the browser already exists by the time this runs, and
          # `gh release create` would fail on it. Attach the files to it instead, and
          # leave whatever notes were written there alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading the files to it"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SolidLauncher ${VERSION}" \
              --generate-notes \
              --notes "$(cat "$notes")" \
              "${files[@]}"
          fi
          # Either way the release must end up carrying every file.
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')" -eq "${#files[@]}"
