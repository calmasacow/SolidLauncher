name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, lint: true }
          - { arch: aarch64, runner: ubuntu-24.04-arm, lint: false }
    env:
      NFPM_VERSION: "2.43.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.arch }}
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev
      - name: Format
        if: matrix.lint
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and smoke test
        run: |
          cargo build --release --locked -p solid-launcher
          target/release/solid-launcher --help
      - name: Packaging tools
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends librsvg2-bin desktop-file-utils
          case "${{ matrix.arch }}" in
            x86_64) nfpm_arch=x86_64; appimage_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; appimage_arch=aarch64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          sudo install -m 755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Package, so a broken package definition fails here and not at release time
        run: |
          set -eu
          packaging/unix/package.sh 0.0.0 linux "${{ matrix.arch }}" target/release/solid-launcher
          a="${{ matrix.arch }}"
          dpkg-deb --contents "dist/solid-launcher-0.0.0-linux-$a.deb" | grep -F usr/bin/solid-launcher
          test -x "dist/solid-launcher-0.0.0-linux-$a.AppImage"
          test -s "dist/solid-launcher-0.0.0-linux-$a.rpm"
          desktop-file-validate packaging/unix/solid-launcher.desktop
          ls -la dist/
      # The packages CI already builds are thrown away at the end of the run. Keeping
      # them means any branch can be installed and tried on real hardware without
      # cutting a release first. They are versioned 0.0.0 and unsigned: test builds.
      - name: Keep the packages, so this branch can be installed and tried
        uses: actions/upload-artifact@v4
        with:
          name: test-build-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Test Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          # No hosted arm64 Windows runner is relied on: cross-compiling from x64 proves
          # it builds. Running it needs arm64 hardware.
          - { arch: arm64, runner: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-${{ matrix.arch }}
      - name: Test
        # The suite covers the Windows install layout and the zip guards; it runs on the
        # host architecture only.
        if: matrix.arch == 'x64'
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build --release --locked -p solid-launcher --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.arch == 'x64'
        run: ./target/${{ matrix.target }}/release/solid-launcher.exe --help
      # --help never opens a window, so it passed all the way through a build whose wgpu
      # had no Windows backend compiled in: the launcher started, failed to make a
      # surface and exited before drawing. This starts it for real and fails if it is
      # not still running, which is what that bug looked like from outside.
      - name: Open the window, and fail if it does not stay open
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/solid-launcher.exe"
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Host "::error::the launcher exited on its own with $($app.ExitCode)"
            $log = Join-Path $env:USERPROFILE '.config/solid-launcher/last-error.log'
            if (Test-Path $log) { Write-Host "--- $log ---"; Get-Content $log }
            else { Write-Host "no $log was written" }
            exit 1
          }
          Write-Host "still running after 20s"
          Stop-Process -Id $app.Id -Force
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package, so a broken installer fails here and not at release time
        shell: pwsh
        run: |
          packaging/windows/package.ps1 -Version 0.0.0 -Arch "${{ matrix.arch }}" `
            -Binary "target/${{ matrix.target }}/release/solid-launcher.exe"
          Get-Item dist/solid-launcher-*.msi | ForEach-Object { Write-Host $_.Name $_.Length }
      # The Start Menu entry showed a blank page because the icon's name in the MSI had
      # no .ico extension: Windows Installer unpacks it under that name and the shell
      # cannot read a file with no extension. Nothing about the build said so, so the
      # finished installer is asked what it actually contains.
      - name: Check the installer really carries a usable icon
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $msi = (Get-Item dist/solid-launcher-*.msi).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $db, @('SELECT `Name`, `Data` FROM `Icon`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $found = @()
          while ($true) {
            $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $row) { break }
            $name = $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(1))
            $size = $row.GetType().InvokeMember('DataSize', 'GetProperty', $null, $row, @(2))
            Write-Host "icon in the installer: $name ($size bytes)"
            $found += [pscustomobject]@{ Name = $name; Size = $size }
          }
          if ($found.Count -eq 0) {
            Write-Host '::error::the installer carries no icon at all'; exit 1
          }
          foreach ($icon in $found) {
            if ($icon.Name -notmatch '\.(ico|exe)$') {
              Write-Host "::error::icon '$($icon.Name)' has no .ico or .exe extension, so the shell cannot read it"
              exit 1
            }
            if ($icon.Size -lt 1024) {
              Write-Host "::error::icon '$($icon.Name)' is only $($icon.Size) bytes"
              exit 1
            }
          }
          Write-Host 'the installer carries a usable icon'
      - name: Keep the installer, so this branch can be installed and tried
        uses: actions/upload-artifact@v4
        with:
          name: test-build-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Test macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
      - name: Test
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build both architectures
        run: |
          cargo build --release --locked -p solid-launcher --target aarch64-apple-darwin
          cargo build --release --locked -p solid-launcher --target x86_64-apple-darwin
      - name: Package the app bundle
        run: packaging/macos/package.sh 0.0.0-ci --skip-build
      - name: Smoke test the bundled binary
        run: ./target/macos-package/SolidLauncher.app/Contents/MacOS/SolidLauncher --help
      - name: Keep the app, so this branch can be installed and tried
        uses: actions/upload-artifact@v4
        with:
          name: test-build-macos-universal
          path: dist/
          if-no-files-found: error
          retention-days: 14
